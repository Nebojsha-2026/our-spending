<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5E57;text-decoration:none}a:hover{color:#0B4642}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'DM Sans', sans-serif; color: #1A1C1E; display: flex; flex-direction: column; padding: 20px 20px 28px 20px; gap: 18px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCDAD3; display: flex; align-items: center; justify-content: center; color: #1A1C1E; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
    <div style="font-size: 16px; font-weight: 600">Add spending</div>
    <div style="width: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0">
    <div style="font-size: 13px; color: #5B6167">Amount</div>
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 600; letter-spacing: -1.5px; line-height: 1">{{display}}</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E9E7E0; border-radius: 12px; padding: 4px">
    <sc-for list="{{who}}" as="w" hint-placeholder-count="2">
      <button onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #5B6167">Category</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: auto">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 54px; border-radius: 14px; border: none; background: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 500; color: #1A1C1E; cursor: pointer">{{k.label}}</button>
    </sc-for>
  </div>

  <a href="Main.dc.html" style="height: 54px; border-radius: 16px; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Save</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: '12.50', who: 'you', cat: 'Eating out' };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var press = function (k) {
      return function () {
        var a = self.state.amount;
        if (k === 'del') { a = a.slice(0, -1); }
        else if (k === '.') { if (a.indexOf('.') === -1) a = (a || '0') + '.'; }
        else {
          var dot = a.indexOf('.');
          if (dot !== -1 && a.length - dot > 2) return;
          if (a.replace('.', '').length >= 7) return;
          a = a === '0' ? k : a + k;
        }
        self.setState({ amount: a });
      };
    };
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del'].map(function (k) {
      return { label: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'Delete digit' : k === '.' ? 'Decimal point' : k, press: press(k) };
    });
    var who = [['you', 'You'], ['sam', 'Sam']].map(function (x) {
      var on = x[0] === s.who;
      var col = x[0] === 'you' ? '#1D4ED8' : '#C2410C';
      return {
        label: x[1],
        pick: function () { self.setState({ who: x[0] }); },
        style: 'height: 40px; border-radius: 9px; font-size: 14px; cursor: pointer; ' + (on ? 'background: ' + col + '; color: #FFFFFF; border: none; font-weight: 600' : 'background: transparent; color: #5B6167; border: none; font-weight: 500')
      };
    });
    var cats = ['Groceries', 'Eating out', 'Transport & fuel', 'Shopping', 'Bills & utilities', 'Health', 'Entertainment', 'Other'].map(function (c) {
      var on = c === s.cat;
      return {
        label: c,
        pick: function () { self.setState({ cat: c }); },
        style: 'height: 38px; padding: 0 14px; border-radius: 19px; font-size: 14px; cursor: pointer; ' + (on ? 'background: #0F766E; color: #FFFFFF; border: 1px solid #0F766E; font-weight: 600' : 'background: #FFFFFF; color: #1A1C1E; border: 1px solid #DCDAD3; font-weight: 500')
      };
    });
    return { display: '$' + (s.amount || '0'), keys: keys, who: who, cats: cats };
  }
}
</script>
</body>
</html>
